# iPhone 16 Pro (iPhone17,1) profile for iOS 27.0.1 24A446 (xnu-12377.121.6).
# Chip/board ids come from the IPSW BuildManifest (0x8140, 0x0C). The kernelcache digest, the AMFI wrapper address and the
# OS/SystemOS volume identities were measured on this same IPSW by YX2748198202-lab/UniXNU-shennong
# (profiles/os/ios-27.0.1-24A446-iphone16pro); verified here only as far as the CI prelink step accepts them.
["os"]
"name" = "iphone-27.0.1-24A446"
"arch" = "arm64e"
"darwin" = "25.5.0"
# No Darwin 26 XNU source is published yet. 24A446 runs on the xnu-12377 kernel with the Darwin 26
# system calls added (patches/xnu/series); move to the Darwin 26 tag when Apple publishes it.
"xnu_version" = "12377.121.6"
"xnu_revision" = "ac9718fb1af618d5ce8678d0dc6e8a58f252216f"
# 12377 carries iokit/DriverKit; EXTERNAL_HEADERS/TrustCache comes from the last tag that ships it.
"driverkit_tag" = "xnu-12377.121.6"
"trustcache_tag" = "xnu-8796.101.5"
"ios_version" = "27.0"
"abi" = []


["ipsw"]
"url" = "https://updates.cdn-apple.com/2026FallFCS/59ffd938-75b6-41e5-af04-f4295ee8aeb3/iPhone17,1_27.0.1_24A446_Restore.ipsw"
"product" = "iPhone17,1"
"version" = "27.0.1"
"build" = "24A446"
"device_class" = "d93ap"
"chip_id" = 33088
"board_id" = 12
"fetch" = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]


["kernel"]

["kernel"."prelink"]
"tool" = "kits/XnuPrelink/emit_prelink.py"
"kernel" = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
"kernelcache_sha256" = "fa07057bf34f33af1ec26681ad0c87c13e5aaa548a300740eddb0e92876e5f95"
"slide" = "-0x1000000"
# The iPadOS regression policy names the iPad kernelcache and rejects this prelink; re-baseline from a measured kernel.json first.
# regression_policy = "scripts/policies/ipados-27.0.1-24A446/prelink-regression.json"
# The AMFI wrapper that calls _initializeAppleMobileFileIntegrity and returns 0; the kernel patch calls it early.
"early_security_init" = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff00921000c"
# Bring-up: match against the symbol-bearing RELEASE build of the same XNU source
# (scripts/build-fileset-release-reference.py --lto) and send unmatched calls to the
# reporting stub of fileset-unmapped-call.patch.
"extra_args" = ["--fileset-reference", "build/xnu/fileset-reference/mach.release.bcm2837.unstripped.noctf", "--allow-missing"]
"roots" = ["com.apple.AppleFSCompression.AppleFSCompressionTypeZlib", "com.apple.driver.AppleARMPlatform", "com.apple.driver.AppleARMWatchdogTimer", "com.apple.driver.AppleAudioClockLibs", "com.apple.driver.AppleEffaceableStorage", "com.apple.driver.AppleIISController", "com.apple.driver.AppleM2ScalerCSCDriver", "com.apple.driver.AppleMobileFileIntegrity", "com.apple.driver.ApplePMGR", "com.apple.driver.IODARTFamily", "com.apple.filesystems.apfs", "com.apple.iokit.CoreAnalyticsFamily", "com.apple.iokit.IOAVFamily", "com.apple.iokit.IOAudio2Family", "com.apple.iokit.IOCECFamily", "com.apple.iokit.IOCryptoAcceleratorFamily", "com.apple.iokit.IOGPUFamily", "com.apple.iokit.IOHDCPFamily", "com.apple.iokit.IOMobileGraphicsFamily", "com.apple.iokit.IOReportFamily", "com.apple.iokit.IOSlowAdaptiveClockingFamily", "com.apple.iokit.IOStorageFamily", "com.apple.iokit.IOSurface", "com.apple.kec.Libm", "com.apple.kec.corecrypto", "com.apple.kext.AppleMatch", "com.apple.kext.CoreTrust", "com.apple.security.AppleImage4", "com.apple.security.sandbox", "com.apple.iokit.IOHIDFamily", "com.apple.iokit.IOHIDEventDriver"]


["adt"]

["adt"."root"]

["adt"."root"."string"]
"model" = "iPhone17,1"
"target-type" = "D93"
"compatible" = "D93AP"


["adt"."chosen"]

["adt"."chosen"."string"]
"osenvironment" = "main"
"crypto-hash-method" = "sha2-384"


["adt"."chosen"."u32"]
# A Mac reads these two and chip-id over lockdown and looks them up in MobileDevice's device map. No match leaves the device class unknown,
# which it reports as "a software update is required". The chip-id is the board's [payload.adt] chip_id.
"board-id" = 12
"security-domain" = 1
"certificate-production-status" = 0
"effective-production-status-ap" = 0
"certificate-security-mode" = 1
"effective-security-mode-sep" = 1
"amfi-only-platform-code" = 1


